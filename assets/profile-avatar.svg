<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="chip" x1="80" y1="72" x2="240" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="320" height="320">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="320" height="320" rx="28" fill="url(#bg)"/>

  <circle cx="160" cy="132" r="86" stroke="#1E293B" stroke-width="2"/>
  <circle cx="160" cy="132" r="86" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.15;0.55;0.15" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#glow)">
    <rect x="95" y="67" width="130" height="130" rx="14" fill="url(#chip)" fill-opacity="0.17" stroke="#22D3EE" stroke-width="2"/>
    <rect x="120" y="92" width="80" height="80" rx="10" fill="#0B1220" stroke="#38BDF8" stroke-width="1.5"/>
  </g>

  <g stroke="#38BDF8" stroke-width="2">
    <line x1="160" y1="45" x2="160" y2="67"/>
    <line x1="160" y1="197" x2="160" y2="219"/>
    <line x1="73" y1="132" x2="95" y2="132"/>
    <line x1="225" y1="132" x2="247" y2="132"/>
    <line x1="101" y1="73" x2="114" y2="86"/>
    <line x1="206" y1="178" x2="219" y2="191"/>
    <line x1="101" y1="191" x2="114" y2="178"/>
    <line x1="206" y1="86" x2="219" y2="73"/>
  </g>

  <text x="160" y="145" text-anchor="middle" fill="#E2E8F0" font-size="34" font-family="JetBrains Mono, monospace" font-weight="700">VV</text>
  <text x="160" y="256" text-anchor="middle" fill="#93C5FD" font-size="14" font-family="JetBrains Mono, monospace">OpenBMC + AI/ML</text>
  <text x="160" y="277" text-anchor="middle" fill="#64748B" font-size="11" font-family="JetBrains Mono, monospace">Firmware Engineer</text>
</svg>
