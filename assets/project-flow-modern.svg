<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="arr" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <style>
      .title { fill:#7DD3FC; font:700 28px 'JetBrains Mono', monospace; }
      .step { fill:#E2E8F0; font:600 18px 'JetBrains Mono', monospace; }
      .note { fill:#94A3B8; font:500 13px 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <rect x="2" y="2" width="1196" height="326" rx="16" fill="url(#bg)" stroke="#1E293B"/>
  <text x="36" y="52" class="title">Project Execution Flow (Validation to Production)</text>

  <g transform="translate(70,120)">
    <rect x="0" y="0" width="180" height="78" rx="10" fill="#0F172A" stroke="#22D3EE"/>
    <text x="90" y="35" text-anchor="middle" class="step">Branch Sync</text>
    <text x="90" y="58" text-anchor="middle" class="note">AI conflict scan</text>

    <line x1="180" y1="39" x2="250" y2="39" stroke="url(#arr)" stroke-width="3"/>
    <polygon points="250,39 238,31 238,47" fill="#0EA5E9">
      <animateTransform attributeName="transform" type="translate" values="0 0; 4 0; 0 0" dur="1.4s" repeatCount="indefinite"/>
    </polygon>

    <rect x="250" y="0" width="180" height="78" rx="10" fill="#0F172A" stroke="#22D3EE"/>
    <text x="340" y="35" text-anchor="middle" class="step">Boot Verify</text>
    <text x="340" y="58" text-anchor="middle" class="note">watchdog + health gates</text>

    <line x1="430" y1="39" x2="500" y2="39" stroke="url(#arr)" stroke-width="3"/>
    <polygon points="500,39 488,31 488,47" fill="#0EA5E9">
      <animateTransform attributeName="transform" type="translate" values="0 0; 4 0; 0 0" dur="1.4s" begin="0.2s" repeatCount="indefinite"/>
    </polygon>

    <rect x="500" y="0" width="180" height="78" rx="10" fill="#0F172A" stroke="#22D3EE"/>
    <text x="590" y="35" text-anchor="middle" class="step">Security Gate</text>
    <text x="590" y="58" text-anchor="middle" class="note">PFM + policy checks</text>

    <line x1="680" y1="39" x2="750" y2="39" stroke="url(#arr)" stroke-width="3"/>
    <polygon points="750,39 738,31 738,47" fill="#0EA5E9">
      <animateTransform attributeName="transform" type="translate" values="0 0; 4 0; 0 0" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
    </polygon>

    <rect x="750" y="0" width="180" height="78" rx="10" fill="#0F172A" stroke="#22D3EE"/>
    <text x="840" y="35" text-anchor="middle" class="step">Recovery Plan</text>
    <text x="840" y="58" text-anchor="middle" class="note">brick-free rollback</text>

    <line x1="930" y1="39" x2="1000" y2="39" stroke="url(#arr)" stroke-width="3"/>
    <polygon points="1000,39 988,31 988,47" fill="#0EA5E9">
      <animateTransform attributeName="transform" type="translate" values="0 0; 4 0; 0 0" dur="1.4s" begin="0.6s" repeatCount="indefinite"/>
    </polygon>

    <rect x="1000" y="0" width="130" height="78" rx="10" fill="#0F172A" stroke="#22D3EE"/>
    <text x="1065" y="35" text-anchor="middle" class="step">Release</text>
    <text x="1065" y="58" text-anchor="middle" class="note">prod rollout</text>
  </g>
</svg>
